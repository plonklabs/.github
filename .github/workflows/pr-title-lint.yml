name: PR Title Lint

# Reusable workflow. Validates a pull request's title against the EU / Angular
# commit convention — `<type>(<scope>): <subject>` — using
# amannn/action-semantic-pull-request. Calling repos squash-merge, so the PR
# title becomes the commit subject on the default branch; the title is where
# the convention is enforced.
#
# The allowed scopes are read from a file in the CALLING repo (default
# `.github/commit-scopes.txt`, one scope per line, `#`-comments and blank
# lines ignored) so adding a scope is a one-line change there — no edit to
# this shared workflow. Call it with:
#
#   on:
#     pull_request:
#       types: [opened, edited, synchronize]
#   jobs:
#     pr-title:
#       uses: plonklabs/.github/.github/workflows/pr-title-lint.yml@main

on:
  workflow_call:
    inputs:
      scopes-file:
        description: >-
          Path, in the calling repo, to the newline-delimited allowed-scopes
          file. Lines starting with `#` and blank lines are ignored.
        type: string
        required: false
        default: .github/commit-scopes.txt
      require-scope:
        description: Whether a scope must always be present in the title.
        type: boolean
        required: false
        default: true
      runs-on:
        description: Runner to execute on.
        type: string
        required: false
        default: ubuntu-latest

jobs:
  pr-title:
    runs-on: ${{ inputs['runs-on'] }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - id: scopes
        # Read the calling repo's scope list (comments + blank lines stripped)
        # into a step output. Same-job step-to-step passing keeps the multiline
        # value off the reusable-workflow input boundary.
        run: |
          {
            echo 'list<<PR_TITLE_SCOPES_EOF'
            grep -vE '^[[:space:]]*(#|$)' "${{ inputs['scopes-file'] }}"
            echo 'PR_TITLE_SCOPES_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The eight EU / Angular commit types.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
          scopes: ${{ steps.scopes.outputs.list }}
          requireScope: ${{ inputs['require-scope'] }}
          # EU convention: the subject is imperative and lowercase. Reject a
          # subject that starts with an uppercase letter.
          subjectPattern: '^(?![A-Z]).+$'
          subjectPatternError: >-
            The subject "{subject}" must start lowercase and be imperative
            present tense (e.g. "add", not "Added").
